- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseTimeAgentRule
  components:
  - type: TimeAgentRule
  - type: AntagSelection

- type: entity
  parent: BaseTimeAgentRule
  id: TimeAgent
  components:
  - type: GameRule
    minPlayers: 15
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ TimeAgent ]
      max: 1
      blacklist:
        components:
        - AntagImmune
        - Changeling
      mindRoles:
      - MindRoleTimeAgent
      startingGear: TimeAgentGear
      briefing:
        sound: "/Audio/_Viva/Misc/ccd-intro.ogg"

- type: entity
  abstract: true
  parent: BaseGameRule
  id: BaseConspiracyRule
  components:
  - type: ConspiracyRule
  - type: AntagSelection

- type: entity
  parent: BaseGameRule
  id: Conspiracy
  components:
  - type: ConspiracyRule
  - type: GameRule 
    minPlayers: 10
  - type: AntagObjectives
    objectives:
    - ConspiracyObjective
  - type: AntagSelection
    selectionTime: PrePlayerSpawn
    definitions:
    - prefRoles: [ Conspirator ]
      min: 2
      max: 7
      playerRatio: 5
      blacklist:
        components:
        - AntagImmune
      components:
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - ConspiracyRadio
- 
      mindRoles:
      - MindRoleConspiracy
